name: Caviar
description: >-
  Caviar is a premium restaurant food-ordering and delivery marketplace that
  connects diners with local, higher-end and popular restaurants for on-demand
  delivery and pickup. Originally launched in 2012 and later owned by Square,
  Caviar was acquired by DoorDash in 2019 and now operates on DoorDash's
  logistics and marketplace platform under the trycaviar.com brand. The service
  focuses on curated restaurant selection, quality-oriented ordering, courier
  delivery, and catering. Caviar does not publish a public developer API or
  developer portal; this API Evangelist profile tracks the company as a
  portfolio lead and captures whatever public, agent-relevant surface exists.
